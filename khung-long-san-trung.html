<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khủng Long Săn Trứng May Mắn</title><style>
:root{font-family:system-ui,'Segoe UI',sans-serif;color:#fff7dc}*{box-sizing:border-box}body{margin:0;background:#102e2b}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:11px 14px;font-weight:800;color:#263728;background:#ffe08b;box-shadow:0 4px 0 #b78e3c}button:disabled{opacity:.45;cursor:not-allowed}button.secondary{background:#d3f1de;box-shadow:0 4px 0 #7bafa0}input,textarea,select{width:100%;border:2px solid #b2d1b0;border-radius:11px;padding:9px;background:#f8fff4;color:#18372b}textarea{min-height:105px;resize:vertical}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}header{padding:13px 24px;background:linear-gradient(90deg,#244b36,#40774c);display:flex;align-items:center;justify-content:space-between;gap:10px}header h1{margin:0;font-size:clamp(20px,2.5vw,31px);color:#fff0a0;text-shadow:0 3px #573d28}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px;padding:14px;max-width:1700px;margin:auto}.stage{position:relative;overflow:hidden;border:7px solid #9c6d39;border-radius:22px;background:#5ba3a2;min-height:540px;box-shadow:0 12px 35px #071b17}canvas{display:block;width:100%;height:100%;position:absolute;inset:0}.hud{position:absolute;top:12px;left:12px;background:#173b30d9;padding:9px 15px;border:2px solid #e9cb80;border-radius:15px;font-weight:800;pointer-events:none}.stage-controls{position:absolute;bottom:15px;left:0;right:0;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.panel{border:5px solid #a57944;background:linear-gradient(#426a4c,#284c3e);border-radius:20px;padding:15px;max-height:calc(100vh - 110px);overflow:auto;box-shadow:0 10px 24px #0005}.panel h2{margin:0;color:#ffe1a2;font-size:22px}.muted{font-size:12px;color:#d3e8d6}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.pill{padding:7px 10px;border-radius:99px;background:#183e34;border:1px solid #a9bfa3}.notice{background:#183d30;border-radius:12px;padding:10px;font-size:13px;margin:9px 0}#overlay{position:fixed;inset:0;background:#071d21b9;display:none;align-items:center;justify-content:center;z-index:99999;padding:16px;backdrop-filter:blur(7px)}#overlay.show{display:flex}.modal{width:min(610px,96vw);background:linear-gradient(155deg,#fff8d8,#dbf9d5);border:9px solid #e2a54d;border-radius:28px;color:#244a32;text-align:center;padding:24px;box-shadow:0 0 0 5px #593e28,0 25px 100px #0009;max-height:94vh;overflow:auto}.modal h2{font-size:clamp(25px,4vw,42px);margin:7px 0;color:#9d5a22}.winner{font-size:clamp(32px,5vw,58px);font-weight:1000;color:#236c50;text-shadow:0 3px #d4df99}.question{font-size:20px;font-weight:750;white-space:pre-wrap}.modal button{margin:6px}.timer{font-size:30px;font-weight:900}.small{font-size:12px}#history{max-height:115px;overflow:auto;font-size:13px}.file{font-size:12px}#questionArea{display:none}.mode-help{font-size:12px;color:#f6e7ae} @media(max-width:900px){.layout{grid-template-columns:1fr}.stage{height:65vh;min-height:430px}.panel{max-height:none}}@media(min-width:901px){.stage{height:calc(100vh - 103px)}}
</style></head><body><header><h1>🦕 KHỦNG LONG SĂN TRỨNG MAY MẮN</h1><div class="pill" id="headerLabel">Lớp học vui vẻ</div></header><main class="layout"><section class="stage" id="stage"><canvas id="game"></canvas><div class="hud" id="hud">Sẵn sàng khám phá rừng tiền sử!</div><div class="stage-controls"><button id="start">🦖 KHỦNG LONG SĂN TRỨNG</button><button id="reset" class="secondary">↻ Đặt lại lượt</button><button id="full" class="secondary">⛶ Toàn màn hình</button><button id="sound" class="secondary">🔊 Âm thanh</button></div></section><aside class="panel"><h2>⚙️ Bảng điều khiển</h2><label>Tên giáo viên</label><input id="teacher" placeholder="Ví dụ: Cô Lan"><label>Tên lớp</label><input id="klass" placeholder="Ví dụ: Lớp 3A"><label>Kiểu chơi</label><select id="playMode"><option value="auto">Khủng long tự đi săn trứng</option><option value="pick">Thầy cô chọn trứng trên sân</option></select><div class="mode-help" id="modeHelp">Bấm bắt đầu để khủng long chạy tìm trứng.</div><label>Chế độ kiểm tra</label><select id="quizMode"><option value="name">Chỉ gọi tên học sinh</option><option value="quiz">Gọi tên và trả lời câu hỏi</option></select><div class="row"><div><label>Hoạt cảnh</label><select id="duration"><option value="10">10 giây</option><option value="15" selected>15 giây</option><option value="20">20 giây</option></select></div><div><label>Trả lời</label><select id="answerTime"><option value="15">15 giây</option><option value="30" selected>30 giây</option><option value="60">60 giây</option></select></div></div><label>Danh sách học sinh (mỗi dòng một tên)</label><textarea id="students">An

Con vật nào kêu meo meo? | Con mèo</textarea></div><div class="notice"><div id="counter">Đã gọi: 0</div><div id="history"></div></div><div class="small">Chạy offline. Chọn trứng: bấm trực tiếp vào quả trứng trên sân. Dữ liệu lưu trên máy này.</div></aside></main><div id="overlay"><div class="modal"><div style="font-size:55px">🥚✨🦕</div><h2>TRỨNG MAY MẮN ĐÃ NỞ!</h2><div class="small">Học sinh được triệu hồi</div><div class="winner" id="winner"></div><div id="quizResult" hidden><hr><div class="question" id="questionText"></div><div class="timer" id="timer"></div><button id="showAnswer" class="secondary">👀 Hiện đáp án</button><div id="answerText" hidden></div></div><div><button id="next">Tiếp tục chơi</button><button id="close" class="secondary">Đóng</button></div></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');let W=1000,H=620,scale=1,now=0,dt=0,last=0;let names=[],used=[],eggs=[],particles=[],phase='idle',target=null,elapsed=0,limit=15,teacherPos={x:.15,y:.68},camera=0,selectedName='',soundOn=true,audio=null,timerHandle=null;const fields=['teacher','klass','students','questions','playMode','quizMode','duration','answerTime'];const rand=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const shuffle=a=>a.sort(()=>Math.random()-.5);function resize(){let r=canvas.getBoundingClientRect();W=r.width;H=r.height;let d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function save(){let obj={};fields.forEach(k=>obj[k]=$(k).value);localStorage.setItem('dinoGameSettingsV1',JSON.stringify(obj));$('headerLabel').textContent=($("teacher").value||'Thầy/Cô')+' • '+($('klass').value||'Lớp học');refresh()}function load(){try{let v=JSON.parse(localStorage.getItem('dinoGameSettingsV1')||'{}');fields.forEach(k=>{if(v[k]!=null)$(k).value=v[k]})}catch(e){}save()}function refresh(){let all=$('students').value.split(/\r?\n|;/).map(x=>x.trim()).filter(Boolean);names=[...new Set(all)];used=used.filter(x=>names.includes(x));$('counter').textContent=`Đã gọi: ${used.length}/${names.length} • Còn ${names.length-used.length}`;$('history').textContent=used.length?'Đã gọi: '+used.join(' · '):'Chưa có học sinh nào được gọi';$('questionArea').style.display=$('quizMode').value==='quiz'?'block':'none';$('modeHelp').textContent=$('playMode').value==='pick'?'Bấm vào một quả trứng để khủng long chạy tới và làm trứng nở.':'Bấm bắt đầu để khủng long tự chọn trứng.';makeEggs()}function makeEggs(){if(phase!=='idle')return;eggs=[];let available=names.filter(n=>!used.includes(n));let count=Math.min(18,available.length);let sorted=shuffle([...available]);for(let i=0;i<count;i++){let col=i%6,row=Math.floor(i/6);eggs.push({name:sorted[i],x:.16+col*.13+rand(-.025,.025),y:.47+row*.15+rand(-.02,.02),hue:(i*53+35)%360,wiggle:rand(0,6),hatched:false})}}function play(f=440,len=.12,type='sine',vol=.06){if(!soundOn)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+len);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+len)}catch(e){}}function start(t){if(phase!=='idle')return;refresh();let remain=names.filter(n=>!used.includes(n));if(!remain.length){alert('Đã gọi hết học sinh! Bấm Đặt lại lượt để tiếp tục.');return}if(!eggs.length)makeEggs();target=t||eggs.find(e=>e.name===remain[Math.floor(Math.random()*remain.length)])||eggs[0];if(!target)return;selectedName=target.name;limit=+$('duration').value;elapsed=0;phase='chase';$('start').disabled=true;$('hud').textContent='🦕 Khủng long đang tìm trứng...';play(440,.25,'triangle');}function finish(){if(phase!=='chase')return;phase='hatch';elapsed=0;target.hatched=true;for(let i=0;i<70;i++)particles.push({x:target.x,y:target.y,vx:rand(-.25,.25),vy:rand(-.45,-.06),life:rand(.6,1.8),h:rand(0,360)});play(600,.15);setTimeout(()=>play(780,.17),180);setTimeout(()=>play(990,.3),390);$('hud').textContent='🥚 Quả trứng đang nở!';setTimeout(showResult,1700)}function showResult(){if(phase!=='hatch')return;phase='result';if(!used.includes(selectedName))used.push(selectedName);$('winner').textContent=selectedName;$('quizResult').hidden=$('quizMode').value!=='quiz';if($('quizMode').value==='quiz'){let qs=$('questions').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let q=qs.length?qs[Math.floor(Math.random()*qs.length)]:'Hãy trả lời câu hỏi của thầy/cô.';let parts=q.split('|');$('questionText').textContent=(parts[0]||'').trim();$('answerText').textContent='Đáp án: '+(parts.slice(1).join('|').trim()||'Thầy/cô công bố đáp án');$('answerText').hidden=true;$('timer').textContent=$('answerTime').value+'s';clearInterval(timerHandle);let sec=+$('answerTime').value;timerHandle=setInterval(()=>{$('timer').textContent=Math.max(0,--sec)+'s';if(sec<=0){clearInterval(timerHandle);play(330,.4)}},1000)}$('overlay').classList.add('show');refresh();save();}function dismiss(){clearInterval(timerHandle);$('overlay').classList.remove('show');phase='idle';target=null;$('start').disabled=false;$('hud').textContent='Sẵn sàng cho lượt tiếp theo!';makeEggs()}
function round(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function poly(points,fill){ctx.fillStyle=fill;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill()}function ellipse(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function label(txt,x,y,bg='#174c39'){ctx.font=`bold ${Math.max(12,W*.017)}px system-ui`;let tw=ctx.measureText(txt).width;ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(x-tw/2-12,y-22,tw+24,29,12);ctx.fill();ctx.strokeStyle='#fff4b2';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(txt,x,y-2)}function background(){let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#6dd9f7');sky.addColorStop(.56,'#d2f9cc');sky.addColorStop(1,'#69ad66');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);round(W*.83,H*.13,45,'#fff0a1');for(let i=0;i<7;i++){let x=(i*.22-.12)*W,y=(.29+Math.sin(i*2)*.05)*H;ellipse(x,y,W*.2,H*.14,'#60b58b')}for(let i=0;i<7;i++){let x=(i*.2-.1)*W,y=.42*H;ellipse(x,y,W*.15,H*.1,'#3e8f70')}poly([[0,H*.48],[W,H*.46],[W,H],[0,H]],'#83b86a');poly([[W*.05,H*.48],[W*.95,H*.48],[W,H],[0,H]],'#c49a62');for(let i=0;i<16;i++){let x=i/15*W,y=H*(.45+.02*Math.sin(i));ctx.strokeStyle='#6b4c32';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(x,y-35);ctx.lineTo(x,y+18);ctx.stroke();if(i>0){ctx.strokeStyle='#bd8b54';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x-W/15,y-15);ctx.lineTo(x,y-15);ctx.stroke()}}for(let i=0;i<16;i++){let x=(i*.173+.05)%1*W,y=H*(.51+(i%5)*.09);ellipse(x,y,rand(5,10),3,'#a88452')} // volcano
poly([[W*.06,H*.38],[W*.19,H*.12],[W*.32,H*.38]],'#5d8179');poly([[W*.145,H*.205],[W*.19,H*.12],[W*.238,H*.205]],'#ef9b5b');for(let i=0;i<7;i++){let x=(i*.19+.06)*W,y=H*.43;ctx.fillStyle='#6d4b2c';ctx.fillRect(x-6,y-55,12,60);for(let j=0;j<4;j++)ellipse(x,y-53+j*9,25-j*3,16,'#257b58')}ctx.fillStyle='#d7b27b';ctx.beginPath();ctx.ellipse(W*.5,H*.76,W*.43,H*.21,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e8d39c';ctx.lineWidth=8;ctx.stroke();}function drawEgg(e){let x=e.x*W,y=e.y*H,r=Math.min(W,H)*.047,wig=Math.sin(now*2+e.wiggle)*3;ellipse(x,y+r*.75,r*.85,r*.25,'#584c3b77');ctx.save();ctx.translate(x,y+wig);ctx.rotate(Math.sin(now*1.7+e.wiggle)*.07);let grad=ctx.createRadialGradient(-r*.35,-r*.55,1,0,0,r*1.3);grad.addColorStop(0,'#ffffff');grad.addColorStop(.35,`hsl(${e.hue} 90% 83%)`);grad.addColorStop(1,`hsl(${e.hue} 60% 44%)`);ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(0,0,r*.76,r,0,0,Math.PI*2);ctx.fill();for(let j=0;j<4;j++)round(Math.sin(j*2+e.wiggle)*r*.37,Math.cos(j*3)*r*.55,r*.1,`hsla(${e.hue+50} 75% 50% / .6)`);if(e.hatched){ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-r*.65,0);ctx.lineTo(-r*.18,-r*.15);ctx.lineTo(0,r*.08);ctx.lineTo(r*.3,-r*.18);ctx.lineTo(r*.65,-r*.1);ctx.stroke()}ctx.restore();label(e.name,x,y-r*1.35)}function dinosaur(){let x=teacherPos.x*W,y=teacherPos.y*H,s=Math.min(W,H)*.007;ctx.save();ctx.translate(x,y+Math.sin(now*10)*3);let flip=target&&target.x<teacherPos.x?-1:1;ctx.scale(flip*s,s);ellipse(0,10,25,7,'#534e3b55');ellipse(-7,-12,25,18,'#48ad6d');ellipse(19,-32,21,20,'#62d58a');ellipse(34,-24,14,9,'#62d58a');poly([[-25,-12],[-51,-4],[-30,-27]],'#49ae6c');for(let i=0;i<4;i++)poly([[-25+i*11,-25],[-18+i*11,-39],[-10+i*11,-26]],'#e9b665');ellipse(-11,3,7,13,'#31945e');ellipse(12,3,7,13,'#31945e');ellipse(12,-26,4,6,'#f7fff2');round(14,-27,2.5,'#193f35');round(29,-18,2.2,'#295b4a');ellipse(1,-9,11,12,'#a5ebad');ctx.restore();label($('teacher').value||'Thầy/Cô',x,y-77*s)}function drawParticles(d){for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*d;p.y+=p.vy*d;p.vy+=.32*d;p.life-=d;round(p.x*W,p.y*H,Math.max(1,5*p.life),`hsla(${p.h} 100% 65% / ${clamp(p.life,0,1)})`);if(p.life<=0)particles.splice(i,1)}}function render(t){dt=Math.min((t-last)/1000||0,.05);last=t;now=t/1000;ctx.clearRect(0,0,W,H);ctx.save();if(phase==='chase'){elapsed+=dt;let p=clamp(elapsed/limit,0,1);camera=Math.sin(now*1.2)*Math.min(6,p*6);ctx.translate(camera,Math.sin(now*2)*2);if(target){let goalX=target.x-(p<.83?.15:.015),goalY=target.y+.065;let speed=p<.83?.18:.45;teacherPos.x+=(goalX-teacherPos.x)*Math.min(1,dt*speed*5);teacherPos.y+=(goalY-teacherPos.y)*Math.min(1,dt*speed*5);if(p<.83){target.x=clamp(target.x+Math.sin(now*1.7)*dt*.06,.13,.88);target.y=clamp(target.y+Math.cos(now*1.4)*dt*.04,.46,.87)}if(elapsed>=limit&&Math.hypot(teacherPos.x-target.x,teacherPos.y-target.y)<.09)finish();if(elapsed>limit+3)finish()}$('hud').textContent=`🦖 Đang đuổi bắt... ${Math.ceil(Math.max(0,limit-elapsed))}s`;}background();eggs.sort((a,b)=>a.y-b.y).forEach(drawEgg);dinosaur();drawParticles(dt);ctx.restore();requestAnimationFrame(render)}
canvas.addEventListener('click',ev=>{if($('playMode').value!=='pick'||phase!=='idle')return;let rect=canvas.getBoundingClientRect(),x=(ev.clientX-rect.left)/rect.width,y=(ev.clientY-rect.top)/rect.height;let e=eggs.find(e=>Math.hypot((e.x-x)*W,(e.y-y)*H)<Math.min(W,H)*.08);if(e)start(e)});$('start').onclick=()=>{if($('playMode').value==='pick'){$('hud').textContent='🥚 Hãy bấm vào một quả trứng trên sân!';play(530,.15);return}start()};$('reset').onclick=()=>{if(phase!=='idle')return;if(confirm('Đặt lại tất cả lượt gọi tên?')){used=[];refresh();save()}};$('full').onclick=()=>{let s=$('stage');if(!document.fullscreenElement)s.requestFullscreen?.();else document.exitFullscreen?.()};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Âm thanh':'🔇 Tắt tiếng';if(soundOn)play()};$('save').onclick=()=>{save();play(680,.15);$('hud').textContent='💾 Đã lưu cài đặt!'};$('showAnswer').onclick=()=>{$('answerText').hidden=false};$('next').onclick=dismiss;$('close').onclick=dismiss;$('import').onchange=async e=>{let file=e.target.files[0];if(!file)return;let text=await file.text();if(file.name.toLowerCase().endsWith('.csv'))text=text.split(/\r?\n/).map(x=>x.split(',')[0].replace(/^"|"$/g,'')).join('\n');$('students').value=text;used=[];save()};fields.forEach(k=>$(k).addEventListener('change',()=>{if(phase==='idle')save()}));load();requestAnimationFrame(render);})();
</script></body></html>
